<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 교육용 웹앱 - 미리보기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-900 bg-slate-50 antialiased">
    <!-- 상단 헤더 영역 -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex-shrink-0 flex items-center">
                <span class="text-xl font-bold text-indigo-600">EduWebApp</span>
            </div>
            <nav class="hidden md:flex space-x-8">
                <a href="#" class="text-gray-500 hover:text-gray-900 px-3 py-2 text-sm font-medium">홈</a>
                <a href="#" class="text-gray-500 hover:text-gray-900 px-3 py-2 text-sm font-medium">강의 목록</a>
                <a href="#" class="text-gray-500 hover:text-gray-900 px-3 py-2 text-sm font-medium">소개</a>
            </nav>
            <div class="flex items-center md:hidden">
                <button class="text-gray-500 hover:text-gray-900 focus:outline-none">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="flex-grow">
        <div class="flex flex-col items-center justify-center min-h-[calc(100vh-4rem-5rem)] py-12 px-4 sm:px-6 lg:px-8">
            <!-- Hero Section -->
            <div class="max-w-3xl w-full space-y-8 text-center animate-fade-in-up">
                <div>
                    <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold text-gray-900 tracking-tight leading-tight">
                        나만의 교육용 <span class="text-indigo-600 bg-indigo-50 px-2 rounded-lg">웹앱 만들기</span>
                    </h1>
                    <p class="mt-6 text-lg sm:text-xl text-gray-600 max-w-2xl mx-auto leading-relaxed">
                        이곳은 Next.js와 Tailwind CSS로 구성된 빠르고 안정적인 기본 보일러플레이트입니다.
                        복잡한 설정 없이 바로 아이디어를 실현해 보세요.
                    </p>
                </div>

                <div class="mt-8 flex justify-center gap-4 flex-col sm:flex-row">
                    <button class="inline-flex justify-center items-center px-8 py-3.5 border border-transparent text-lg font-medium rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-0.5">
                        학습 시작하기
                    </button>
                    <button class="inline-flex justify-center items-center px-8 py-3.5 border border-gray-300 text-lg font-medium rounded-xl text-gray-700 bg-white hover:bg-gray-50 shadow-sm hover:shadow-md transition-all duration-200">
                        더 알아보기
                    </button>
                </div>

                <!-- 확장 영역 -->
                <div class="mt-20 pt-10 border-t border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-800 mb-2">기능 확장 영역</h2>
                    <p class="text-sm text-gray-500 mb-6">
                        아래 공간에 새로운 기능 컴포넌트를 배치해 보세요.
                    </p>
                    <div class="w-full h-48 border-2 border-dashed border-gray-300 rounded-xl flex items-center justify-center text-gray-400 bg-gray-50 hover:bg-gray-100 transition-colors cursor-pointer group">
                        <span class="group-hover:text-indigo-500 group-hover:scale-105 transition-all duration-200 font-medium">
                            + 새로운 컴포넌트 추가
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 하단 푸터 영역 -->
    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center">
            <p class="text-center md:text-left text-sm text-gray-500">
                &copy; 2026 EduWebApp. All rights reserved.
            </p>
            <div class="mt-4 md:mt-0 flex space-x-6">
                <a href="#" class="text-gray-400 hover:text-gray-500 text-sm">이용약관</a>
                <a href="#" class="text-gray-400 hover:text-gray-500 text-sm">개인정보처리방침</a>
            </div>
        </div>
    </footer>
</body>
</html>
